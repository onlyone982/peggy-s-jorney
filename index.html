<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>peggy's journey</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <!-- 공유 버튼: 누르면 게임 링크가 복사됩니다. 글자는 js/i18n.js에서 언어에 맞게 바뀝니다 -->
  <div class="share" role="group" aria-label="Share the game link">
    <button type="button" data-key="ig" aria-label="Copy link: Instagram" title="Share on Instagram">
      <svg viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="9" fill="#d6249f"/><rect x="9" y="9" width="18" height="18" rx="5.5" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="18" cy="18" r="4.3" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="23.3" cy="12.7" r="1.3" fill="#fff"/></svg>
    </button>
    <button type="button" data-key="fb" aria-label="Copy link: Facebook" title="Share on Facebook">
      <svg viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="9" fill="#1877f2"/><path d="M19.6 29V19.6h3.1l.5-3.6h-3.6v-2.3c0-1 .3-1.8 1.8-1.8h2V8.7c-.3 0-1.5-.1-2.8-.1-2.8 0-4.6 1.7-4.6 4.7V16h-3.1v3.6h3.1V29z" fill="#fff"/></svg>
    </button>
    <button type="button" data-key="rd" aria-label="Copy link: Reddit" title="Share on Reddit">
      <svg viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="9" fill="#ff4500"/><ellipse cx="18" cy="20.5" rx="8.5" ry="6" fill="#fff"/><circle cx="9.8" cy="17.3" r="2.2" fill="#fff"/><circle cx="26.2" cy="17.3" r="2.2" fill="#fff"/><circle cx="14.7" cy="20" r="1.5" fill="#ff4500"/><circle cx="21.3" cy="20" r="1.5" fill="#ff4500"/><path d="M14.8 23.4c1.8 1.3 4.6 1.3 6.4 0" fill="none" stroke="#ff4500" stroke-width="1.2" stroke-linecap="round"/><path d="M18 14.4l1.2-5 4 .9" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24.6" cy="10.5" r="1.8" fill="#fff"/></svg>
    </button>
    <button type="button" data-key="dc" aria-label="Copy link: Discord" title="Share on Discord">
      <svg viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="9" fill="#5865f2"/><path d="M26 11.2a15 15 0 0 0-3.7-1.2l-.5 1a14 14 0 0 0-3.6 0l-.5-1A15 15 0 0 0 14 11.2c-2.3 3.4-2.9 6.7-2.6 10 1.5 1.1 3 1.8 4.5 2.200l1-1.600c-.6-.2-1.100-.5-1.600-.8l.4-.3c3.100 1.400 6.400 1.400 9.500 0l.4.3c-.5.300-1 .600-1.600.8l1 1.600c1.500-.4 3-1.100 4.500-2.200.4-3.800-.7-7.100-2.500-10z" fill="#fff"/><circle cx="15.2" cy="18" r="1.6" fill="#5865f2"/><circle cx="20.8" cy="18" r="1.6" fill="#5865f2"/></svg>
    </button>
  </div>
  <h1>peggy's journey</h1>
  <span class="spacer" aria-hidden="true"></span>
</header>
<div class="wrap">
  <canvas id="g" data-i18n-aria="screen" aria-label="peggy's journey game screen"></canvas>
  <a id="ad" hidden rel="sponsored noopener noreferrer"></a>
</div>
<div class="pad">
  <button id="bj" data-i18n="jump">▲ Jump</button>
  <button id="bd" data-i18n="slide">▼ Slide (hold)</button>
</div>
<p class="tip" data-i18n="tip">PC: Space or ↑ to jump (hold longer to jump higher), ↓ to slide · Mobile: tap to jump (hold longer for a higher jump)</p>
<div id="toast" role="status" aria-live="polite"></div>
<script src="js/i18n.js"></script>
<script src="js/game.js"></script>
</body>
</html>
